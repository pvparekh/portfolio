<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="JetBrains Mono, Consolas, monospace">
  <title>Slipstream homepage camera path, top-down and side elevation</title>
  <rect width="1200" height="560" fill="#08080D"/>
  <defs>
    <linearGradient id="trail" x1="0" x2="1">
      <stop offset="0" stop-color="#F59E0B" stop-opacity="0.15"/>
      <stop offset="0.5" stop-color="#FFE2A8"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0.15"/>
    </linearGradient>
  </defs>
  <text x="40" y="44" fill="#F1F5F9" font-size="18" font-family="Space Grotesk, Arial, sans-serif" font-weight="700">SLIPSTREAM · homepage camera path</text>
  <text x="40" y="66" fill="#8793A3" font-size="11">TOP VIEW (x across, travel −Z to the right) · scroll position is the only input · same pose forward and back</text>

  <!-- floor grid hint -->
  <g stroke="#F59E0B" stroke-opacity="0.07">
    <line x1="40" y1="110" x2="1160" y2="110"/><line x1="40" y1="170" x2="1160" y2="170"/>
    <line x1="40" y1="230" x2="1160" y2="230"/><line x1="40" y1="290" x2="1160" y2="290"/>
  </g>

  <!-- path (top view): x maps world z (0..-1000), y maps world x -->
  <path d="M60 200 C 150 200, 170 200, 230 200 S 330 200, 380 200 L 640 200 C 680 200, 690 230, 715 235 C 745 240, 760 165, 790 165 C 815 165, 820 225, 850 222 C 880 220, 900 200, 960 200 L 1140 200"
        fill="none" stroke="url(#trail)" stroke-width="3"/>

  <!-- stations -->
  <g font-size="11" fill="#F1F5F9">
    <circle cx="60" cy="200" r="7" fill="#F59E0B"/>
    <text x="48" y="232">S0</text><text x="30" y="248" fill="#8793A3">HERO · grid</text>
    <!-- name gate -->
    <line x1="95" y1="180" x2="95" y2="220" stroke="#F1F5F9" stroke-width="3"/>
    <text x="80" y="170" fill="#8793A3" font-size="10">name opens</text>

    <circle cx="230" cy="200" r="22" fill="none" stroke="#F59E0B" stroke-width="2"/>
    <text x="218" y="248">S1</text><text x="196" y="264" fill="#8793A3">ABOUT · halo</text>

    <g stroke="#F59E0B" stroke-width="3">
      <line x1="420" y1="180" x2="420" y2="220" stroke="#22C55E"/>
      <line x1="440" y1="180" x2="440" y2="220"/>
      <line x1="530" y1="180" x2="530" y2="220"/>
      <line x1="610" y1="180" x2="610" y2="220"/>
    </g>
    <line x1="380" y1="178" x2="640" y2="178" stroke="#F59E0B" stroke-opacity="0.35"/>
    <line x1="380" y1="222" x2="640" y2="222" stroke="#F59E0B" stroke-opacity="0.35"/>
    <text x="490" y="248">S2</text><text x="420" y="264" fill="#8793A3">EXPERIENCE · straight</text>
    <text x="404" y="168" fill="#8793A3" font-size="9">DOWC ×2</text>
    <text x="508" y="168" fill="#8793A3" font-size="9">PTS</text>
    <text x="586" y="168" fill="#8793A3" font-size="9">MARKETEQ</text>

    <ellipse cx="715" cy="250" rx="22" ry="12" fill="none" stroke="#E8002D" stroke-width="2"/>
    <g stroke="#4ADE80" stroke-width="2"><line x1="783" y1="140" x2="783" y2="160"/><line x1="797" y1="140" x2="797" y2="160"/></g>
    <g stroke="#8B5CF6" stroke-width="2"><line x1="840" y1="236" x2="870" y2="236"/><line x1="840" y1="242" x2="870" y2="242"/><line x1="840" y1="248" x2="870" y2="248"/><line x1="840" y1="254" x2="870" y2="254"/></g>
    <text x="770" y="290">S3</text><text x="700" y="306" fill="#8793A3">PROJECTS · three systems</text>

    <circle cx="960" cy="200" r="7" fill="none" stroke="#94A3B8" stroke-width="2"/>
    <text x="948" y="248">S4</text><text x="900" y="264" fill="#8793A3">SKILLS · crane up</text>

    <circle cx="1140" cy="200" r="7" fill="#FFE2A8"/>
    <text x="1128" y="248">S5</text><text x="1080" y="264" fill="#8793A3">CONTACT · horizon</text>
  </g>

  <!-- elevation -->
  <text x="40" y="350" fill="#8793A3" font-size="11">SIDE ELEVATION (camera height y) · dwell plateaus are flat, transits ramp</text>
  <line x1="40" y1="520" x2="1160" y2="520" stroke="#F59E0B" stroke-opacity="0.25"/>
  <path d="M60 500 L 90 500 L 120 498 L 230 496 L 380 496 L 640 495 L 715 494 L 790 495 L 850 495 L 900 470 L 940 390 L 980 390 L 1030 470 L 1080 505 L 1140 505"
        fill="none" stroke="#F59E0B" stroke-width="2"/>
  <text x="935" y="380" fill="#F1F5F9" font-size="10">y ≈ 46 (overview)</text>
  <text x="60" y="540" fill="#8793A3" font-size="10">y ≈ 1.7</text>
  <text x="1080" y="540" fill="#8793A3" font-size="10">y ≈ 1.4</text>
</svg>
